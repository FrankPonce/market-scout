[project]
name = "marketscout"
version = "0.1.0"
description = "An evidence-cited market intelligence agent for any product category and European country."
requires-python = ">=3.10"
dependencies = ["langgraph>=0.2", "httpx>=0.27", "python-dotenv>=1.0", "pytrends>=4.9", "yt-dlp>=2024.1"]

[project.optional-dependencies]
dev = ["pytest>=8"]
mcp = ["mcp>=2.0"]

[project.scripts]
marketscout = "marketscout.cli:main"
marketscout-mcp = "marketscout.mcp_server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
